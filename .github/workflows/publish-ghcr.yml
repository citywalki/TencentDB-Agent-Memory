# 发布三件套 Docker 镜像到 GitHub Packages（GHCR）。
#
# 版本遵循官方上游（TencentCloud/TencentDB-Agent-Memory）的 tag 命名：
#   v2.0.1        稳定版      → 镜像 tag 2.0.1，并更新 :latest
#   v2.0.2-beta.1 预发布      → 镜像 tag 2.0.2-beta.1，不动 :latest
#                              （对齐上游 GitHub Release 的 prerelease 语义）
#
# 三种触发方式：
#   1. Sync Upstream Release workflow 调用（workflow_call，推荐）：
#      选上游 tag → 自动同步代码 → 同一 run 内直接发布
#   2. 推送 v* tag（tag 指向的提交需已包含本 workflow）
#   3. 手动 dispatch：指定版本/镜像/平台
#
# 镜像（复用 deploy/dockerhub/publish.sh，与 Docker Hub 发布同源，
# 自动完成 secret-scan、memory-proxy 私有 submodule 剥离、
# memory-hub 合并 context 准备）：
#   ghcr.io/<owner>/memory-core    ← MemoryCore/
#   ghcr.io/<owner>/memory-proxy   ← MemoryProxy/
#   ghcr.io/<owner>/memory-hub     ← MemoryPanel/ + MemoryKnowledge/ 合并
#
# 认证：内置 GITHUB_TOKEN（本文件已声明 packages:write），无需额外 Secret。
# 首次推送生成的 package 默认 private，可在仓库 Packages 设置中调整可见性。

name: Publish Docker Images (GHCR)

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      version:
        description: "镜像版本号（X.Y.Z 或 X.Y.Z-beta.N，与上游 tag 一致）"
        required: true
        type: string
      targets:
        required: false
        type: string
        default: "all"
      platforms:
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      push_latest:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "镜像版本号（X.Y.Z 或 X.Y.Z-beta.N，与上游 tag 一致）"
        required: true
        type: string
      targets:
        description: "要发布的镜像"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - memory-core
          - memory-proxy
          - memory-hub
      platforms:
        description: "构建平台（逗号分隔）"
        required: false
        default: "linux/amd64,linux/arm64"
        type: string
      push_latest:
        description: "强制更新 :latest（默认：稳定版自动更新，beta 不更新）"

permissions:
  contents: read
  packages: write

# 发布流程串行且不互相取消，避免半途打断 push
concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: 解析发布参数
        id: vars
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGETS: ${{ inputs.targets }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # v2.0.2-beta.1 → 2.0.2-beta.1
            version="${GITHUB_REF_NAME#v}"
            targets=all
            platforms="linux/amd64,linux/arm64"
          else
            # 手动 dispatch 或被 sync workflow 调用（with: 传入 inputs.*）
            version="${INPUT_VERSION:-}"
            targets="${INPUT_TARGETS:-all}"
            platforms="${INPUT_PLATFORMS:-linux/amd64,linux/arm64}"
          fi

          # :latest 策略（与上游 prerelease 语义一致）：稳定版自动更新，
          # -beta.N 不动；push_latest=true 可强制
          if [[ "$version" == *-beta.* ]]; then
            also_latest=0
          else
            also_latest=1
          fi
          if [[ "$INPUT_PUSH_LATEST" == "true" ]]; then
            also_latest=1
          fi

          # 严格对齐上游 tag 格式，提前失败，避免构建 20 分钟后才报错
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "::error::版本号需为 X.Y.Z 或 X.Y.Z-beta.N（与上游 tag 一致），收到: ${version:-<空>}"
            exit 1
          fi

          # GHCR 要求镜像名全小写
          namespace=$(echo "$GITHUB_REPOSITORY_OWNER" | tr "[:upper:]" "[:lower:]")

          {
            echo "version=$version"
            echo "also_latest=$also_latest"
            echo "targets=$targets"
            echo "platforms=$platforms"
            echo "namespace=$namespace"
          } >> "$GITHUB_OUTPUT"

          echo "目标: ghcr.io/$namespace ($targets) 版本: $version 平台: $platforms latest: $also_latest"

      - name: 安装 QEMU（linux/arm64 模拟构建）
        uses: docker/setup-qemu-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        env:
          REGISTRY: ghcr.io
          NAMESPACE: ${{ steps.vars.outputs.namespace }}
          VERSION: ${{ steps.vars.outputs.version }}
          PLATFORMS: ${{ steps.vars.outputs.platforms }}
          ALSO_LATEST: ${{ steps.vars.outputs.also_latest }}
        run: bash deploy/dockerhub/publish.sh "${{ steps.vars.outputs.targets }}"
