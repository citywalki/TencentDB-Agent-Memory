# 发布三件套 Docker 镜像到 GitHub Packages（GHCR）。
#
# 触发方式：
#   1. 推送 v* tag（如 v1.2.3）→ 发布全部镜像；tag 去掉 v 前缀作为
#      版本号，并同步更新 :latest
#   2. 手动 workflow_dispatch → 可指定版本、镜像、平台、是否推 :latest
#
# 镜像（复用 deploy/dockerhub/publish.sh，与 Docker Hub 发布同源，
# 自动完成 secret-scan、memory-proxy 私有 submodule 剥离、
# memory-hub 合并 context 准备）：
#   ghcr.io/<owner>/memory-core    ← MemoryCore/
#   ghcr.io/<owner>/memory-proxy   ← MemoryProxy/
#   ghcr.io/<owner>/memory-hub     ← MemoryPanel/ + MemoryKnowledge/ 合并
#
# 认证：内置 GITHUB_TOKEN（本文件已声明 packages:write），无需额外 Secret。
# 首次推送生成的 package 默认 private，可在仓库 Packages 设置中调整可见性。

name: Publish Docker Images (GHCR)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "镜像版本号（如 1.0.0；不能以 dev- 开头）"
        required: true
        type: string
      targets:
        description: "要发布的镜像"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - memory-core
          - memory-proxy
          - memory-hub
      platforms:
        description: "构建平台（逗号分隔）"
        required: false
        default: "linux/amd64,linux/arm64"
        type: string
      push_latest:
        description: "同时更新 :latest"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

# 发布流程串行且不互相取消，避免半途打断 push
concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: 解析发布参数
        id: vars
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGETS: ${{ inputs.targets }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # v1.2.3 → 1.2.3；正式 tag 视为发布，同步 :latest
            version="${GITHUB_REF_NAME#v}"
            also_latest=1
            targets=all
            platforms="linux/amd64,linux/arm64"
          else
            version="${INPUT_VERSION:-}"
            if [[ "$INPUT_PUSH_LATEST" == "true" ]]; then
              also_latest=1
            else
              also_latest=0
            fi
            targets="${INPUT_TARGETS:-all}"
            platforms="${INPUT_PLATFORMS:-linux/amd64,linux/arm64}"
          fi

          # 提前校验，避免构建 20 分钟后才在 publish.sh 里失败
          if [[ -z "$version" ]]; then
            echo "::error::版本号不能为空"
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9] ]]; then
            echo "::error::版本号需以数字开头（如 1.0.0），收到: $version"
            exit 1
          fi
          if [[ "$version" == dev-* ]]; then
            echo "::error::版本号不能以 dev- 开头（不发布开发版本）"
            exit 1
          fi

          # GHCR 要求镜像名全小写
          namespace=$(echo "$GITHUB_REPOSITORY_OWNER" | tr "[:upper:]" "[:lower:]")

          {
            echo "version=$version"
            echo "also_latest=$also_latest"
            echo "targets=$targets"
            echo "platforms=$platforms"
            echo "namespace=$namespace"
          } >> "$GITHUB_OUTPUT"

          echo "目标: ghcr.io/$namespace ($targets) 版本: $version 平台: $platforms latest: $also_latest"

      - name: 安装 QEMU（linux/arm64 模拟构建）
        uses: docker/setup-qemu-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        env:
          REGISTRY: ghcr.io
          NAMESPACE: ${{ steps.vars.outputs.namespace }}
          VERSION: ${{ steps.vars.outputs.version }}
          PLATFORMS: ${{ steps.vars.outputs.platforms }}
          ALSO_LATEST: ${{ steps.vars.outputs.also_latest }}
        run: bash deploy/dockerhub/publish.sh "${{ steps.vars.outputs.targets }}"
